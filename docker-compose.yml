version: '3.8'


services:
    trenlly:
      build: ./
      command: ./trenlly-beta-
      ports:
      - 8070:8070
      depends_on:
      - db
      environment:
      - DB_PASSWORD=qwerty

    db:
      image: postgres:latest
      volumes:
      - ./.database/postgres/data:/var/lib/postgresql/data
      environment:
      - POSTGRES_PASSWORD=qwerty
      ports:
      - 5438:5432